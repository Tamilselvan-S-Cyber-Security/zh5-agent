[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zh5-scan"
version = "6.0.1"
description = "ZH5 Scan — AI-powered bug bounty hunting from recon to report, in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ZH5 / Tamilselvan-S-Cyber-Security" }]
keywords = ["security", "bug-bounty", "recon", "pentest", "ai-agent", "vulnerability", "zh5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX",
    "Environment :: Console",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.32.3",
    "mcp>=1.28",
]

[project.optional-dependencies]
test = ["pytest>=8.3.2"]

[project.urls]
Homepage = "https://zh5.club"
Repository = "https://github.com/Tamilselvan-S-Cyber-Security/zh5-agent"
Issues = "https://github.com/Tamilselvan-S-Cyber-Security/zh5-agent/issues"
Documentation = "https://github.com/Tamilselvan-S-Cyber-Security/zh5-agent#readme"

[project.scripts]
zh5 = "bughunter.__main__:main"
zh5-scan = "bughunter.__main__:main"
zh5-agent = "bughunter.__main__:agent_main"
bughunter = "bughunter.__main__:main"
bughunter-agent = "bughunter.__main__:agent_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bughunter*"]

[tool.setuptools.package-data]
bughunter = ["**/*"]
